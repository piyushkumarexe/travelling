name: yatrawise
description: "Tourism - Smart Tourism & Safety Assistant for Android."
publish_to: "none"
version: 1.0.6+7

environment:
  sdk: ">=3.5.0 <5.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Firebase ---
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.6.4
  firebase_storage: ^12.3.6

  # --- Google Sign-In ---
  google_sign_in: ^6.2.2

  # --- Maps & location (real GPS + MapTiler tiles, no Google Maps key) ---
  google_maps_flutter: ^2.12.1
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # --- Navigation, networking, UI ---
  go_router: ^14.8.1
  dio: ^5.8.0
  intl: ">=0.19.0 <0.21.0"
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^17.2.3
  flutter_markdown: ^0.7.4+3
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
