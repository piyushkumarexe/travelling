name: Build APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable  # latest stable (2026 deps need a modern SDK)
          cache: true

      - name: Install dependencies
        run: set -o pipefail; flutter pub get 2>&1 | tee pub-get.log

      - name: Upload pub diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pub-diagnostics
          path: pub-get.log
          if-no-files-found: warn
          retention-days: 7

      - name: Surface pub error as annotations
        if: failure()
        run: |
          (flutter --version 2>&1 | head -n 3; echo '---'; tail -n 25 pub-get.log) > /tmp/surf.txt
          MSG=$(sed 's/%/%25/g' /tmp/surf.txt | awk '{printf "%s%%0A", $0}' | head -c 3500)
          echo "::error::$MSG"

      - name: Analyze (fatal warnings)
        run: set -o pipefail; flutter analyze 2>&1 | tee analyze.log

      - name: Surface analyze errors as annotations
        if: failure()
        run: |
          echo "::warning title=analyze shape::lines=$(wc -l < analyze.log) errors=$(grep -a -c -E '^ *error . ' analyze.log || true) warnings=$(grep -a -c -E '^ *warning . ' analyze.log || true)"
          grep -a -E "^ *(error|warning|info|hint) . " analyze.log > /tmp/issues.txt || true
          if [ -s /tmp/issues.txt ]; then
            sed -E 's/^ *(error|warning|info|hint) . .* . ([^ ]+) . ([A-Za-z_0-9]+) *$/\1 \2 \3/' /tmp/issues.txt | paste -d'|' - - - - - | head -n 12 | while IFS= read -r line; do
              echo "::error title=analyze issues::$line"
            done
          else
            cat -n analyze.log | head -n 20 | while IFS= read -r line; do
              MSG=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')
              echo "::warning title=analyze raw::$MSG"
            done
          fi

      - name: Run tests
        # Keep the APK job available while exposing the complete test output.
        # A pipe followed by `|| echo` used to hide the failing test name and
        # made the red aggregate annotation impossible to diagnose.
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee test.log

      - name: Surface test failures as annotations
        if: always()
        run: |
          if [ ! -s test.log ]; then
            echo "::warning title=flutter test::No test log was produced."
            exit 0
          fi
          # Flutter's expanded reporter prints every test path. Only surface
          # actual failure markers, otherwise every passing test appears red
          # in the Actions annotation list.
          if grep -a -Eq ' -[1-9][0-9]*:|\[E\]|Expected:|Actual:|Test failed' test.log; then
            FAILURE_TAIL=$(tail -n 140 test.log \
              | sed 's/%/%25/g; s/\r//g' \
              | awk '{printf "%s%%0A", $0}' | head -c 9000)
            echo "::error title=flutter test failure::$FAILURE_TAIL"
            echo "## Flutter test failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 180 test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-log
          path: test.log
          if-no-files-found: warn
          retention-days: 7

  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21: required by maplibre_gl's Android plugin (source level 21).
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable  # latest stable (2026 deps need a modern SDK)
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore upload keystore (permanent signing key)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set — the APK will be signed with a throwaway debug key (SHA changes every build, updates will NOT install over old versions). Add the single secret (see android/RELEASE_SIGNING_BACKUP.txt) to get the permanent SHA."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.p12
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/app/upload-keystore.p12" >> "$GITHUB_ENV"
          echo "### Permanent signing fingerprints" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          keytool -list -v -keystore android/app/upload-keystore.p12 -storepass "YatraWise-Upload-2026" 2>/dev/null | grep -E "Alias name|SHA1:|SHA256:" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK
        env:
          MAPS_ANDROID_API_KEY: ${{ secrets.MAPS_ANDROID_API_KEY }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: |
          # Sanitized config report (never the full key): tells the user
          # whether the APK got a MapTiler key and its length/prefix.
          if [ -z "$MAPTILER_API_KEY" ]; then
            echo "::warning::MAPTILER_API_KEY secret is not set — the APK will render keyless OpenStreetMap tiles (no 'Invalid key', but no MapTiler tiles). Set the secret to enable MapTiler + satellite/hybrid."
          else
            echo "MAPTILER CONFIG PRESENT=true KEY LENGTH=${#MAPTILER_API_KEY} KEY PREFIX=${MAPTILER_API_KEY:0:4}"
          fi
          DEFINES=""
          if [ -n "${{ secrets.GROQ_API_KEY }}" ]; then
            DEFINES="$DEFINES --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}"
          fi
          if [ -n "${{ secrets.GROQ_MODEL }}" ]; then
            DEFINES="$DEFINES --dart-define=GROQ_MODEL=${{ secrets.GROQ_MODEL }}"
          fi
          if [ -n "${{ secrets.NVIDIA_API_KEY }}" ]; then
            DEFINES="$DEFINES --dart-define=NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}"
          fi
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            DEFINES="$DEFINES --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
          fi
          if [ -n "${{ secrets.GEMINI_MODEL }}" ]; then
            DEFINES="$DEFINES --dart-define=GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}"
          fi
          if [ -n "${{ secrets.AI_API_KEY }}" ]; then
            DEFINES="$DEFINES --dart-define=AI_API_KEY=${{ secrets.AI_API_KEY }}"
          fi
          if [ -n "${{ secrets.AI_BASE_URL }}" ]; then
            DEFINES="$DEFINES --dart-define=AI_BASE_URL=${{ secrets.AI_BASE_URL }}"
          fi
          if [ -n "${{ secrets.AI_MODEL }}" ]; then
            DEFINES="$DEFINES --dart-define=AI_MODEL=${{ secrets.AI_MODEL }}"
          fi
          if [ -n "$MAPTILER_API_KEY" ]; then
            DEFINES="$DEFINES --dart-define=MAPTILER_API_KEY=$MAPTILER_API_KEY"
          fi
          if [ -n "${{ secrets.GOOGLE_WEB_CLIENT_ID }}" ]; then
            DEFINES="$DEFINES --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
          fi
          # objective_c is pinned in pubspec.yaml to the stable-compatible
          # release, so its native Dart assets can build normally.
          # --build-number uses the (always increasing) workflow run number so
          # every new APK installs directly over the previous version.
          set -o pipefail; flutter build apk --release --build-number=${{ github.run_number }} $DEFINES 2>&1 | tee gradle.log

      - name: Surface build errors as annotations
        if: failure()
        run: |
          echo "=== Full gradle.log tail (500) ==="
          tail -n 500 gradle.log || true
          echo "=== Grep What went wrong ==="
          grep -a -A 15 "What went wrong" gradle.log | head -n 80 || true
          echo "=== Grep FAILED/error ==="
          grep -a -E "FAILED|error:|Exception|arm64e|objective_c" gradle.log | tail -n 150 || true
          # Keep the actionable Gradle tail visible even when GitHub's raw log
          # viewer is unavailable to the caller. Use one annotation so the
          # runner does not discard it after its per-step annotation limit.
          GRADLE_TAIL=$(tail -n 120 gradle.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}' | head -c 6000)
          echo "::error title=Gradle failure::$GRADLE_TAIL"
          echo "## Build Failure Tail" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 400 gradle.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Annotations are truncated by GitHub at 4 KB, which can hide the
          # actionable error. On PRs, also post the failure lines as a PR
          # comment where there is no such limit.
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            {
              echo "Build failed — actionable output (annotations truncate at 4 KB):"
              echo '```'
              grep -a -B 2 -A 25 "What went wrong" gradle.log | head -n 80 || true
              echo "--- last 30 lines of gradle.log ---"
              tail -n 30 gradle.log || true
              echo '```'
            } > /tmp/failcomment.md
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/failcomment.md 2>/dev/null || true
          fi

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
            echo "### APK signature" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "SHA-256|SHA-1" /tmp/certs.txt | head -n 4 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            jarsigner -verify "$APK"
          fi

      - name: Prepare verified APK downloads
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp "$APK" dist/yatrawise-release.apk
          sha256sum dist/yatrawise-release.apk > dist/SHA256SUMS.txt
          # GitHub wraps every Actions artifact in its own archive. Put one
          # clearly named, ordinary ZIP inside that wrapper so Android file
          # managers do not have to guess whether an APK is an archive.
          (cd dist && zip -X -9 yatrawise-release.zip yatrawise-release.apk SHA256SUMS.txt)
          unzip -t dist/yatrawise-release.zip
          ls -lh dist/yatrawise-release.apk dist/yatrawise-release.zip

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yatrawise-release-apk
          # Upload only the verified inner ZIP; this avoids duplicating the
          # 120 MB uncompressed APK in the outer GitHub artifact.
          path: dist/yatrawise-release.zip
          if-no-files-found: error
          # The inner ZIP is already compressed. Store it as-is in the outer
          # GitHub archive so the two archives remain independently valid.
          compression-level: 0
          retention-days: 14

      # Phones frequently fail to extract the nested artifact ZIP ("Could
      # not extract file / 1 file was not copied correctly"). Publishing the
      # raw APK on a rolling prerelease tag gives testers a DIRECT download
      # link — no ZIP, no extraction, just install.
      - name: Publish APK to GitHub Release (direct phone download)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="apk-latest"
          NOTES="Latest build: run #${RUN_NUMBER} (${RUN_SHA})
          Direct APK download — no ZIP extraction needed. Install this file directly.
          Includes: nearby detection fixes, search accuracy, live nearby data, real place photos, instant taps (no GPS wait on option click)."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/yatrawise-release.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/yatrawise-release.apk \
              --title "Latest Tourism APK" \
              --notes "$NOTES" \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi
          echo "Direct download:"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/yatrawise-release.apk"
