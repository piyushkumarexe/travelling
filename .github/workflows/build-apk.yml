name: Build APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable  # latest stable (2026 deps need a modern SDK)
          cache: true

      - name: Install dependencies
        run: set -o pipefail; flutter pub get 2>&1 | tee pub-get.log

      - name: Upload pub diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pub-diagnostics
          path: pub-get.log
          if-no-files-found: warn
          retention-days: 7

      - name: Surface pub error as annotations
        if: failure()
        run: |
          (flutter --version 2>&1 | head -n 3; echo '---'; tail -n 25 pub-get.log) > /tmp/surf.txt
          MSG=$(sed 's/%/%25/g' /tmp/surf.txt | awk '{printf "%s%%0A", $0}' | head -c 3500)
          echo "::error::$MSG"

      - name: Analyze (fatal warnings)
        run: set -o pipefail; flutter analyze 2>&1 | tee analyze.log

      - name: Surface analyze errors as annotations
        if: failure()
        run: |
          echo "::warning title=analyze shape::lines=$(wc -l < analyze.log) errors=$(grep -a -c ' error ' analyze.log || true) warnings=$(grep -a -c ' warning ' analyze.log || true)"
          grep -a -E " (error|warning) | info .| hint ." analyze.log > /tmp/issues.txt || true
          if [ -s /tmp/issues.txt ]; then
            sed -E 's/^ *(error|warning|info|hint) . .* . ([^ ]+) . ([A-Za-z_0-9]+) *$/\1 \2 \3/' /tmp/issues.txt | paste -d'|' - - - - - | head -n 12 | while IFS= read -r line; do
              echo "::error title=analyze issues::$line"
            done
          else
            cat -n analyze.log | head -n 20 | while IFS= read -r line; do
              MSG=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')
              echo "::warning title=analyze raw::$MSG"
            done
          fi

      - name: Run tests
        run: set -o pipefail; flutter test 2>&1 | tee test.log

      - name: Surface test failures as annotations
        if: failure()
        run: |
          grep -a -E "FAILED|Expected|Actual|_test.dart" test.log | head -n 60 | while IFS= read -r line; do
            MSG=$(printf '%s' "$line" | sed 's/%/%25/g')
            echo "::error title=flutter test::$MSG"
          done

  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable  # latest stable (2026 deps need a modern SDK)
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore upload keystore (permanent signing key)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set — the APK will be signed with a throwaway debug key (SHA changes every build, updates will NOT install over old versions). Add the single secret (see android/RELEASE_SIGNING_BACKUP.txt) to get the permanent SHA."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.p12
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/app/upload-keystore.p12" >> "$GITHUB_ENV"
          echo "### Permanent signing fingerprints" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          keytool -list -v -keystore android/app/upload-keystore.p12 -storepass "YatraWise-Upload-2026" 2>/dev/null | grep -E "Alias name|SHA1:|SHA256:" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK
        env:
          MAPS_ANDROID_API_KEY: ${{ secrets.MAPS_ANDROID_API_KEY }}
        run: |
          DEFINES=""
          if [ -n "${{ secrets.NVIDIA_API_KEY }}" ]; then
            DEFINES="--dart-define=NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}"
          fi
          # --build-number uses the (always increasing) workflow run number so
          # every new APK installs directly over the previous version.
          flutter build apk --release --build-number=${{ github.run_number }} $DEFINES

      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
            echo "### APK signature" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "SHA-256|SHA-1" /tmp/certs.txt | head -n 4 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            jarsigner -verify "$APK"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yatrawise-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
