name: Verify and build Tourism APKs

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

concurrency:
  group: tourism-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked backend dependencies
        working-directory: functions
        run: npm ci
      - name: Syntax and unit tests
        working-directory: functions
        run: |
          npm run check
          npm test
      - name: Dependency vulnerability gate
        working-directory: functions
        run: npm audit --audit-level=moderate
      - name: Firestore and Storage emulator tests
        run: |
          set -o pipefail
          functions/node_modules/.bin/firebase emulators:exec \
            --only firestore,storage --project demo-tourism \
            'cd functions && npm run test:rules' 2>&1 | tee rules-emulator.log
      - name: Surface rules diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rules-emulator.log')
          lines = p.read_text(errors='replace').splitlines() if p.exists() else ['No emulator log was produced.']
          for line in lines[-70:]:
              safe = line.replace('%', '%25').replace('\r', '%0D')
              print(f'::error title=rules diagnostic::{safe}')
          PY

  analyze-test:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Reject private AI provider keys in client source
        run: |
          if git grep -nE 'fromEnvironment\([^)]*(NVIDIA|GROQ|GEMINI|AI)_API_KEY' -- lib; then
            echo '::error::Private AI provider credentials must remain backend-only.'
            exit 1
          fi
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log
      - name: Test
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee test.log
      - name: Surface Flutter diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('analyze.log', 'test.log'):
              p = Path(name)
              if not p.exists():
                  continue
              lines = p.read_text(errors='replace').splitlines()
              issues = [line for line in lines if 'error •' in line or 'warning •' in line or '[E]' in line or 'Expected:' in line or 'Actual:' in line]
              selected = issues[:60] if issues else lines[-60:]
              for line in selected:
                  safe = line.replace('%', '%25').replace('\r', '%0D')
                  print(f'::error title=Flutter diagnostic::{safe}')
          PY

  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: [backend, analyze-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build debug APK
        env:
          MAPS_ANDROID_API_KEY: ${{ secrets.MAPS_ANDROID_API_KEY }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          defines=()
          if [ -n "${MAPTILER_API_KEY:-}" ]; then
            defines+=("--dart-define=MAPTILER_API_KEY=$MAPTILER_API_KEY")
          fi
          if [ -n "${GOOGLE_WEB_CLIENT_ID:-}" ]; then
            defines+=("--dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID")
          fi
          set -o pipefail
          flutter build apk --debug \
            --build-number='${{ github.run_number }}' "${defines[@]}" 2>&1 | tee build-debug.log
      - name: Surface debug build diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-debug.log')
          lines = p.read_text(errors='replace').splitlines() if p.exists() else ['No debug build log was produced.']
          for line in lines[-70:]:
              safe = line.replace('%', '%25').replace('\r', '%0D')
              print(f'::error title=debug build diagnostic::{safe}')
          PY
      - name: Verify debug APK exists
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          mkdir -p dist
          cp "$apk" dist/tourism-debug.apk
          (cd dist && sha256sum tourism-debug.apk > SHA256SUMS.txt)
      - name: Upload successful debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tourism-debug-apk
          path: |
            dist/tourism-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-release:
    name: Build protected signed release APKs
    runs-on: ubuntu-latest
    needs: [backend, analyze-test, build-debug]
    # Fork PRs and development branches never receive production signing.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Restore and validate protected upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Protected signing secret $name is missing. Refusing release build."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/tourism-upload-keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          {
            echo "ANDROID_KEYSTORE_FILE=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build signed split and universal release APKs
        env:
          MAPS_ANDROID_API_KEY: ${{ secrets.MAPS_ANDROID_API_KEY }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          defines=()
          if [ -n "${MAPTILER_API_KEY:-}" ]; then
            defines+=("--dart-define=MAPTILER_API_KEY=$MAPTILER_API_KEY")
          fi
          if [ -n "${GOOGLE_WEB_CLIENT_ID:-}" ]; then
            defines+=("--dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID")
          fi
          set -o pipefail
          flutter build apk --release --split-per-abi \
            --build-number='${{ github.run_number }}' "${defines[@]}" 2>&1 | tee build-release.log
          mkdir -p build-out/split build-out/universal
          cp build/app/outputs/flutter-apk/*.apk build-out/split/
          flutter build apk --release \
            --build-number='${{ github.run_number }}' "${defines[@]}" 2>&1 | tee -a build-release.log
          cp build/app/outputs/flutter-apk/app-release.apk build-out/universal/
      - name: Surface release build diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-release.log')
          lines = p.read_text(errors='replace').splitlines() if p.exists() else ['No release build log was produced.']
          for line in lines[-70:]:
              safe = line.replace('%', '%25').replace('\r', '%0D')
              print(f'::error title=release build diagnostic::{safe}')
          PY
      - name: Verify signatures, package and alignment
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n1)"
          aligner="$(dirname "$signer")/zipalign"
          aapt="$(dirname "$signer")/aapt"
          test -x "$signer" && test -x "$aligner" && test -x "$aapt"
          expected="$(keytool -list -v -keystore "$ANDROID_KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//; s/://g; s/ //g' | tr 'a-f' 'A-F')"
          test -n "$expected"
          for apk in build-out/split/*.apk build-out/universal/*.apk; do
            "$signer" verify --print-certs "$apk" > /tmp/tourism-cert.txt
            actual="$(grep -m1 'SHA-256 digest' /tmp/tourism-cert.txt \
              | sed 's/.*digest: *//; s/://g; s/ //g' | tr 'a-f' 'A-F')"
            test "$actual" = "$expected"
            "$aligner" -c 4 "$apk"
            "$aapt" dump badging "$apk" > /tmp/tourism-badging.txt
            grep -q "package: name='app.roamio.tourism'" /tmp/tourism-badging.txt
            grep -q 'launchable-activity:' /tmp/tourism-badging.txt
          done
      - name: Prepare verified Tourism downloads
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build-out/split/app-arm64-v8a-release.apk dist/tourism-arm64-v8a.apk
          cp build-out/split/app-armeabi-v7a-release.apk dist/tourism-armeabi-v7a.apk
          cp build-out/split/app-x86_64-release.apk dist/tourism-x86_64.apk
          cp build-out/universal/app-release.apk dist/tourism-universal.apk
          (cd dist && sha256sum tourism-*.apk > SHA256SUMS.txt)
      - name: Upload successful signed release APKs
        uses: actions/upload-artifact@v4
        with:
          name: tourism-signed-release-apks
          path: |
            dist/tourism-*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
