name: roamio
description: "Roamio - Smart Tourism & Safety Assistant for Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Firebase ---
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.6.4
  firebase_storage: ^12.3.6

  # --- Google Sign-In ---
  google_sign_in: ^6.2.2

  # --- Maps & location (real Google Maps SDK, real GPS) ---
  google_maps_flutter: ^2.12.1
  # Key-free OpenStreetMap tiles power the in-app demo/live map.
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # --- Navigation, networking, UI ---
  go_router: ^14.8.1
  dio: ^5.8.0
  # Flutter 3.32.x pins flutter_localizations to intl 0.20.2. Keeping the
  # direct constraint aligned prevents CI dependency resolution failures.
  intl: ^0.20.2
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  # 5.2.4 was never published; 5.2.3 is the final 5.x release.
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
