include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: false
    strict-inference: false
  errors:
    deprecated_member_use: ignore
    # Keep CI focused on correctness. These style/advisory diagnostics are
    # non-fatal for compilation and are handled incrementally during cleanup.
    curly_braces_in_flow_control_structures: ignore
    dangling_library_doc_comments: ignore
    directives_ordering: ignore
    prefer_final_fields: ignore
    unawaited_futures: ignore
    unnecessary_brace_in_string_interps: ignore
    unnecessary_nullable_for_final_variable_declarations: ignore
    use_build_context_synchronously: ignore

linter:
  rules:
    prefer_single_quotes: true
    directives_ordering: true
    unawaited_futures: true
