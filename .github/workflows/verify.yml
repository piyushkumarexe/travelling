name: Verify (analyze + test only)

# Cheap proof job for work-in-progress branches: it runs exactly the two checks
# that decide whether the app compiles and behaves (flutter analyze,
# flutter test) WITHOUT building an APK and WITHOUT touching the public
# `apk-latest` GitHub Release. `build-apk.yml` publishes to that release on
# every run, so it is not something to fire at will from a session branch.
#
# It also sanity-checks the security rules files, which no other job looks at.

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/01a0bd53-travelling'

permissions:
  contents: read

jobs:
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: set -o pipefail; flutter pub get 2>&1 | tee pub-get.log

      - name: Analyze
        id: analyze
        run: |
          set +e
          flutter analyze --no-pub > analyze.log 2>&1
          CODE=$?
          if [ "$CODE" != 0 ]; then
            flutter analyze > analyze-plain.log 2>&1
            echo "flutter analyze (no --no-pub) exit=$CODE" >> analyze.log
            cat analyze-plain.log >> analyze.log
          fi
          # Every issue line becomes an annotation: the artifact store is not
          # reachable from every dev sandbox, so annotations are the reliable
          # channel for reading CI results.
          tail -n 55 analyze.log | while IFS= read -r line; do
            [ -n "$line" ] || continue
            MSG=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')
            case "$line" in
              *'error •'*) echo "::error::$MSG" ;;
              *'warning •'*) echo "::warning::$MSG" ;;
              *) echo "::notice::$MSG" ;;
            esac
          done
          if [ "$CODE" = 0 ]; then
            echo "status=0" >> "$GITHUB_OUTPUT"
          else
            echo "status=1" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Test
        id: test
        run: |
          set +e
          flutter test > test.log 2>&1
          CODE=$?
          tail -n 45 test.log | while IFS= read -r line; do
            [ -n "$line" ] || continue
            MSG=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')
            echo "::notice::$MSG"
          done
          if [ "$CODE" = 0 ]; then
            echo "All tests passed" >> "$GITHUB_STEP_SUMMARY"
            echo "status=0" >> "$GITHUB_OUTPUT"
          else
            echo "status=1" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Sanity-check security rules
        # No emulator/credentials needed: this catches the two classes of
        # rules-file mistake that break a deploy — unbalanced braces and an
        # invalid action name (e.g. `allow query:` does not exist; only
        # read/get/list/create/update/delete/write are valid).
        id: rules
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const valid = new Set([
              "get", "list", "create", "update", "delete", "read", "write",
            ]);
            let bad = 0;
            for (const file of ["firestore.rules", "storage.rules"]) {
              const src = fs.readFileSync(file, "utf8");
              const opens = (src.match(/{/g) || []).length;
              const closes = (src.match(/}/g) || []).length;
              if (opens !== closes) {
                console.error(`${file}: unbalanced braces (${opens} { vs ${closes} })`);
                bad++;
              }
              for (const m of src.matchAll(/allow\s+([^:]+):/g)) {
                for (const action of m[1].split(",").map((a) => a.trim())) {
                  if (!valid.has(action)) {
                    console.error(`${file}: invalid rules action "${action}"`);
                    bad++;
                  }
                }
              }
            }
            if (bad) process.exit(1);
            console.log("rules OK: braces balanced, all actions valid");
          ' || echo "status=1" >> "$GITHUB_OUTPUT"

      - name: Aggregate result
        env:
          ANALYZE: ${{ steps.analyze.outputs.status }}
          TEST: ${{ steps.test.outputs.status }}
          RULES: ${{ steps.rules.outputs.status }}
        run: |
          fail=0
          [ "${ANALYZE:-0}" = "0" ] || { echo "::error::flutter analyze reported issues"; fail=1; }
          [ "${TEST:-0}" = "0" ] || { echo "::error::flutter test failed"; fail=1; }
          [ "${RULES:-0}" = "0" ] || { echo "::error::security rules sanity check failed"; fail=1; }
          if [ "$fail" = "0" ]; then
            echo "### ✅ analyze + $(wc -l < test.log) test log lines + rules all clean" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ see annotations on this run" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: |
            pub-get.log
            analyze.log
            test.log
          if-no-files-found: warn
          retention-days: 7
