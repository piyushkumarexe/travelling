org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# Flutter template flags for AGP 9 (see packages/flutter_tools/templates/
# app/android.tmpl/gradle.properties.tmpl): Flutter plugins apply the
# Kotlin Gradle Plugin themselves, so AGP 9's built-in Kotlin must stay
# off, and KGP rejects the new AGP DSL — keep the classic DSL.
android.newDsl=false
android.builtInKotlin=false
